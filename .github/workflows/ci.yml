name: firmware-and-protocol-ci

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio
      - name: Run host-side tests
        run: python -m unittest discover -v
      - name: Generate protocol report
        run: python tools/frame_lab.py
      - name: Run fault-injection simulation
        run: python tools/fault_lab.py
      - name: Compile STM32 firmware
        run: pio run
